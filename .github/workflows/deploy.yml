name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject EmailJS secrets
        env:
          PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
        run: |
          python3 - <<'EOF'
          import os
          with open('evenementiel.html', 'r') as f:
              content = f.read()
          content = content.replace('VOTRE_PUBLIC_KEY', os.environ['PUBLIC_KEY'])
          content = content.replace('VOTRE_SERVICE_ID', os.environ['SERVICE_ID'])
          content = content.replace('VOTRE_TEMPLATE_ID', os.environ['TEMPLATE_ID'])
          with open('evenementiel.html', 'w') as f:
              f.write(content)
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
