name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject EmailJS secrets
        run: |
          sed -i "s/VOTRE_PUBLIC_KEY/${{ secrets.EMAILJS_PUBLIC_KEY }}/g" evenementiel.html
          sed -i "s/VOTRE_SERVICE_ID/${{ secrets.EMAILJS_SERVICE_ID }}/g" evenementiel.html
          sed -i "s/VOTRE_TEMPLATE_ID/${{ secrets.EMAILJS_TEMPLATE_ID }}/g" evenementiel.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
